<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Accident Counsel - Analysis Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-overlay {
            background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), 
                        url('https://images.unsplash.com/photo-1505664194779-8beaceb93744?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
        }
        @keyframes progress {
            from { stroke-dashoffset: 502; }
            to { stroke-dashoffset: 125; } /* 75% complete */
        }
        .progress-ring-fill {
            animation: progress 2s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center p-4 md:p-10 font-sans">

    <div class="relative w-full max-w-6xl rounded-3xl overflow-hidden shadow-2xl border border-white/10 flex flex-col bg-overlay mb-8">
        
        <div class="bg-[#e13c2d] py-3 flex justify-center items-center gap-2">
            <div class="w-5 h-5 bg-white rounded-full flex items-center justify-center shadow-sm">
                <span class="text-[#e13c2d] text-[12px] font-black">C</span>
            </div>
            <span class="text-white text-sm font-bold uppercase tracking-widest">Car Accident Counsel</span>
        </div>

        <div class="flex-1 flex flex-col lg:flex-row p-8 lg:p-16 text-white relative">
            
            <div class="flex-1 z-10">
                <div class="inline-block bg-blue-500/20 text-blue-400 px-4 py-1 rounded-full text-xs font-bold mb-4 uppercase tracking-widest">
                    AI Analysis Complete
                </div>
                <h1 class="text-3xl md:text-5xl font-extrabold leading-tight mb-6">
                    Your Potential <span class="text-[#e13c2d]">Payout Analysis</span> is Ready.
                </h1>
                
                <div class="flex flex-col md:flex-row gap-6 mb-8">
                    <div class="w-full md:w-48 h-48 rounded-2xl overflow-hidden border-2 border-white/20 shadow-lg shrink-0">
                        <img src="{{img_path}}" alt="Accident Evidence" class="w-full h-full object-cover">
                    </div>
                    
                    <div class="flex-1 bg-white/5 border border-white/10 rounded-2xl p-6 backdrop-blur-sm flex flex-col justify-center">
                        <p class="text-gray-400 text-xs uppercase font-bold mb-2">Damage Classification:</p>
                        <div class="text-2xl md:text-3xl font-mono text-green-400 uppercase tracking-tighter">
                            {{prediction}}
                        </div>
                    </div>
                </div>

                <div class="space-y-4 max-w-sm">
                    <a href="/">
                        <button class="w-full bg-[#e13c2d] hover:bg-[#ff4d3d] hover:-translate-y-1 transition-all duration-300 py-4 px-8 rounded-xl font-bold text-lg shadow-xl flex items-center justify-center gap-2">
                            Back
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                            </svg>
                        </button>
                    </a>
                </div>
            </div>

            <div class="flex flex-col items-center lg:items-end justify-between z-10 mt-12 lg:mt-0">
                <div class="relative flex items-center justify-center">
                    <svg class="w-48 h-48 rotate-[-90deg]">
                        <circle cx="96" cy="96" r="80" stroke="currentColor" stroke-width="12" fill="transparent" class="text-white/5" />
                        <circle cx="96" cy="96" r="80" stroke="currentColor" stroke-width="12" fill="transparent" 
                                class="text-[#e13c2d] progress-ring-fill" stroke-dasharray="502" stroke-dashoffset="502" stroke-linecap="round" />
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span class="text-5xl font-black">75%</span>
                        <span class="text-[10px] text-gray-400 uppercase font-bold">Case Strength</span>
                    </div>
                </div>

                <div class="mt-12 w-full max-w-[280px] space-y-3">
                    <div class="bg-black/40 backdrop-blur-md rounded-xl p-3 flex items-center justify-between border border-white/5">
                        <span class="text-xs font-bold tracking-widest text-gray-300">GOOGLE</span>
                        <div class="flex gap-1 text-yellow-500 text-xs">★★★★★</div>
                    </div>
                    <div class="bg-black/40 backdrop-blur-md rounded-xl p-3 flex items-center justify-between border border-white/5">
                        <span class="text-xs font-bold tracking-widest text-red-500 italic">Yelp</span>
                        <div class="flex gap-1 text-red-500 text-xs">★★★★★</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-white rounded-3xl p-8 shadow-xl">
            <h3 class="text-slate-900 font-bold text-xl mb-2">Location Analysis</h3>
            <p class="text-slate-500 text-sm mb-6">Jurisdictional statutes detected:</p>
            <div class="space-y-4">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 font-bold uppercase">Detected Region</p>
                        <p id="user-location" class="text-slate-900 font-bold italic">Detecting City...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 bg-white rounded-3xl overflow-hidden shadow-xl h-[300px] border-4 border-white relative">
            <iframe id="google-map" class="w-full h-full grayscale" frameborder="0" src=""></iframe>
            <div class="absolute bottom-4 left-4 bg-slate-900 text-white px-3 py-1 rounded-lg text-[10px] font-bold uppercase tracking-widest shadow-lg">
                Live Local Map
            </div>
        </div>
    </div>

    <script>
        async function fetchLocation() {
            try {
                // Fetch city based on IP
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                const city = data.city || "your area";
                const region = data.region || "";
                
                document.getElementById('user-location').innerText = `${city}, ${region}`;
                
                // Set the map source dynamically
                const mapFrame = document.getElementById('google-map');
                const searchQuery = encodeURIComponent(`Personal Injury Lawyers in ${city}`);
                mapFrame.src = `https://maps.google.com/maps?q=${searchQuery}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
                
            } catch (error) {
                document.getElementById('user-location').innerText = "Location Unavailable";
            }
        }
        fetchLocation();
    </script>
</body>
</html>
